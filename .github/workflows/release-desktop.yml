# Desktop release, hands-off: when the version in desktop/src-tauri/tauri.conf.json changes on
# main (or on a manual run), and there's no published GitHub release v<version> yet, build the
# macOS app on an Apple silicon runner (macos-15), sign it with the Developer ID certificate, notarize it with
# an App Store Connect API key (no Apple ID login), sign the updater bundle, and publish the
# release with scripts/release-desktop.ts (draft → assets read back → published).
#
# Secrets live in the "release" environment, which only main may use (scripts/ci-secrets.sh
# uploads them):
#   MACOS_CERT_P12          base64 .p12 with the "Developer ID Application" certificate + key
#   MACOS_CERT_PASSWORD     its export password
#   ASC_KEY_P8              App Store Connect API key (.p8 contents), for notarytool
#   ASC_KEY_ID, ASC_ISSUER_ID
#   TAURI_SIGNING_PRIVATE_KEY           updater key (~/.config/prepress/updater.key contents)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (may be empty)
name: Release desktop app

on:
  push:
    branches: [main]
    paths: [desktop/src-tauri/tauri.conf.json]
  workflow_dispatch:

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          draft=$(gh release view "v$version" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "v$version is already published: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: 'Developer ID Application: AMPLIFY2 OY (A4XZSTY453)'
      PREPRESS_NOTARY_PROFILE: prepress-notary
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: tauri-cli@2

      - name: Signing keychain (Developer ID certificate, notarization key)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass=$(openssl rand -hex 24)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          # Apple's Developer ID intermediates, so the identity is valid on a fresh machine.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" -T /usr/bin/codesign >/dev/null || true
          done
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -k "$keychain" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q "$APPLE_SIGNING_IDENTITY"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          xcrun notarytool store-credentials "$PREPRESS_NOTARY_PROFILE" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --keychain "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/asc.p8"

      - run: npm ci

      - run: npm test

      - name: Build, sign, notarize
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:desktop

      - name: Check the build
        run: |
          set -euo pipefail
          v=${{ needs.check.outputs.version }}
          bundle=desktop/src-tauri/target/release/bundle
          node -e "const j=require('./$bundle/latest.json'); if (j.version !== '$v') { console.error('latest.json is for ' + j.version); process.exit(1); }"
          spctl -a -vv -t install "$bundle/dmg/Prepress_${v}_aarch64.dmg"
          codesign -dvv "$bundle/macos/Prepress.app" 2>&1 | grep -q 'TeamIdentifier=A4XZSTY453'

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx bun scripts/release-desktop.ts

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
